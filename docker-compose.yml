services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: demo
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -c /opt/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - ./broker.conf:/opt/rocketmq/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"

  rocketmq-dashboard:
    image: styletang/rocketmq-console-ng:latest
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "19876:8080"

  # 一次性初始化 xxl_job 库（官方调度中心不会自动建表）
  xxl-job-db-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./infra/xxl-job/tables_xxl_job.sql:/sql/tables_xxl_job.sql:ro
    command:
      - sh
      - -c
      - |
        if mysql --default-character-set=utf8mb4 -h mysql -uroot -p123456 -N \
            -e "SELECT 1 FROM xxl_job.xxl_job_lock LIMIT 1" >/dev/null 2>&1; then
          echo "[xxl-job] tables already exist, skip init"
        else
          mysql --default-character-set=utf8mb4 -h mysql -uroot -p123456 < /sql/tables_xxl_job.sql
        fi
    restart: "no"

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.5.0
    depends_on:
      xxl-job-db-init:
        condition: service_completed_successfully
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=123456
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"

volumes:
  mysql-data:

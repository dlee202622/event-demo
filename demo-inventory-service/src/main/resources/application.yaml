spring:
  application:
    name: demo-inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/demo_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8
    username: root
    password: ${MYSQL_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/event-driven
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 9002

eventdriven:
  persistence: jdbc
  rabbitmq:
    queue: ${spring.application.name}.queue
  outbox:
    # 预占失败事件要尽快送达订单服务，配合下单接口的等待窗口
    relay-interval-ms: 300
    relay-initial-delay-ms: 300

logging:
  level:
    root: INFO
    com.example.demo: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
